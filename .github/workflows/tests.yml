name: Tests and packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build && python -m pip install .
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify the public reference bundle in both packages
        run: python tools/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed entry points outside checkout
        working-directory: /tmp
        run: |
          orsearcher --version
          orsearcher2 --version
          orsearcher --help
          orsearcher references
          orsearcher polish --help

# Genome-scale/native-tool integration checks are separate: install the
# environment.yml dependencies and run the documented example on Linux.
