[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orsearcher2"
version = "2.3.0"
description = "Genome-based insect OR discovery, structural review and bounded model polishing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ORsearcher contributors"}]
keywords = ["bioinformatics", "olfactory-receptor", "genome-annotation", "insects"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/veryxing565/ORsearcher"

[project.scripts]
orsearcher = "orsearcher.cli:main"
orsearcher2 = "orsearcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orsearcher = ["tree_qc.R", "data/defaults/*"]
